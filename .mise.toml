[tasks.build]
description = "Build local preview"
alias = ["b"]
run = "./scripts/build-pages.sh"

[tasks.serve]
description = "Build and serve local preview"
alias = ["s"]
depends = ["build"]
run = '''
PORT="${PORT:-4173}"
echo "[serve] Local preview: http://localhost:${PORT}/"
exec python3 -m http.server "${PORT}" --directory .pages-dist
'''

[tasks.open]
description = "Open local preview"
alias = ["o"]
run = "open http://localhost:4173"
